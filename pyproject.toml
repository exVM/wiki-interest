[project]
name = "wikitrend"
version = "0.1.0"
description = "Wikipedia pageview interest analysis for the wiki-interest agent skill"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "fpdf2>=2.7.8",
]

[project.scripts]
wt = "wikitrend.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts/wikitrend"]
